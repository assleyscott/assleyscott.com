<body><main aria-label="ASR The Collector, 8-bit adventure"><div class="handheld"><section class="screen-bezel" aria-label="Game screen"><span class="power-light" aria-hidden="true"></span><div class="screen-window"><canvas id="game" width="256" height="240" tabindex="0" aria-label="ASR The Collector. Arrows move. Enter or A confirms. B goes back. S opens the menu. Escape pauses."><p>This game needs a browser supporting canvas and JavaScript.</p></canvas></div><div class="screen-brand"><b aria-hidden="true">ASR</b><span aria-hidden="true">THE COLLECTOR</span><button type="button" class="style-key" aria-label="Customise: shell colour, button colour and page backdrop">CUSTOMISE</button></div></section><section class="hardware" aria-label="Handheld controls"><div class="dpad" role="group" aria-label="Directional pad"><button type="button" class="pad-up" data-key="up" aria-label="Move up"><span aria-hidden="true">▲</span></button><button type="button" class="pad-left" data-key="left" aria-label="Move left"><span aria-hidden="true">◀</span></button><span class="pad-centre" aria-hidden="true"></span><button type="button" class="pad-right" data-key="right" aria-label="Move right"><span aria-hidden="true">▶</span></button><button type="button" class="pad-down" data-key="down" aria-label="Move down"><span aria-hidden="true">▼</span></button></div><div class="action-keys" role="group" aria-label="Action buttons"><button type="button" class="key-b" data-key="b" aria-label="B: back, cancel or companion perk">B</button><button type="button" class="key-a" data-key="a" aria-label="A: action or confirm">A</button></div><div class="system-keys"><label><button type="button" data-key="select" aria-label="Select: menu, or back in dialogs"></button><span>SELECT</span></label><label><button type="button" data-key="start" aria-label="Start: start, pause or resume"></button><span>START</span></label></div><span class="speaker" aria-hidden="true"></span><p class="hardware-note" aria-hidden="true">MENU · PLAY / PAUSE</p></section></div><p class="keyboard-hint">ARROWS: MOVE · A / ENTER: ACTION · B / X: BACK · S: MENU · ESC: PAUSE</p><p id="status" class="sr-only" role="status" aria-live="polite">Loading ASR The Collector.</p><div id="accessible" class="sr-only" aria-label="Accessible game controls"></div><noscript><p>Enable JavaScript to play. <a href="https://assleyscott.com/">Back to ASR</a>.</p></noscript></main><script type="module" src="game.js?v=handheld-4"></script><script>/* ===== custom cursor: inverse disc. Mouse only; the native cursor stays on text, drag/grab/resize surfaces and the 3D canvas. ===== */
(function(){
 var mq=window.matchMedia&&matchMedia('(hover:hover) and (pointer:fine), (any-hover:hover) and (any-pointer:fine)');

 // including a trackpad attached after load; never enable from touch alone.
 var root=document.documentElement,el=null,lx=-100,ly=-100,seen=false,last=null,mode='',raf=0;
 var SEM='a[href],button,[role="button"],[role="link"],summary,label[for],select,input[type="button"],input[type="submit"],input[type="checkbox"],input[type="radio"],[onclick]';
 var KEEP='canvas,input[type="range"],.b22g-sl,.b22-scrub,.holo-stage,.pup-chip,#tv-cv,.yt-cv,.lil-gui';
 function mk(){if(el)return;el=document.createElement('div');el.id='ascur';el.setAttribute('aria-hidden','true');el.innerHTML='<i></i>';(document.body||root).appendChild(el)}
 function classify(t){
  if(!t||t.nodeType!==1)return 'disc';
  root.classList.remove('ascur-hide');
  var c='auto',cs;try{cs=getComputedStyle(t);c=cs.cursor||'auto'}catch(e){}

  if(/^(text|vertical-text)$/.test(c))return 'keep';
  if(c!=='pointer'&&t.closest&&t.closest('a[href],button:not([disabled])')&&!/^(grab|grabbing|ew-resize|ns-resize)$/.test(c)||(c==='grab'&&t.closest&&t.closest('.b22r')&&t.closest('a[href],button:not([disabled])')))return 'lens';
  if(c==='pointer')return 'lens';
  if(c==='auto'||c==='default'||c==='none'||c==='progress'||c==='wait'||c==='not-allowed'){
   if(c!=='not-allowed'&&t.closest&&t.closest(SEM)&&!(t.disabled||t.closest('[disabled],[aria-disabled="true"]')))return 'lens';
   return 'disc'}
  return 'keep'}

  root.classList.toggle('ascur-hide',m==='disc'||m==='lens');
  el.classList.toggle('on',seen&&(m==='disc'||m==='lens'));
  el.classList.toggle('lens',m==='lens')}
 function eval_(t){if(t===last&&mode)return;last=t;var m=classify(t);var was=mode;mode='';apply(m)}
 function hide(){seen=false;last=null;mode='';root.classList.remove('ascur-hide','ascur-mouse');if(el)el.classList.remove('on','press','lens');var old=document.querySelector('.cur');if(old)old.classList.remove('on','down','reel')}
 function move(e){
  if(e.pointerType!=='mouse'){hide();return}

 document.addEventListener('visibilitychange',function(){if(document.hidden)hide()});
 if(mq&&mq.addEventListener)mq.addEventListener('change',function(){if(!mq.matches)hide()});
})();

/* ===== content guard: no right-click menu, no drag-saving media, no save/view-source/print/devtools shortcuts ===== */
(function(){
 var EDIT='input,textarea,select,[contenteditable="true"],[contenteditable=""],.nt-ta';

  for(var i=0;i<q.length;i++){var el=q[i],t=el.tagName;
